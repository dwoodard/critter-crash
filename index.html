<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#78c7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Critter Crash">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Critter Crash</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;overscroll-behavior:none}
body{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:none}
#game{display:block;width:100%;height:100%;touch-action:none;background:#101827;object-fit:contain}
</style>
</head>
<body>
<canvas id="game" width="900" height="560" aria-label="Critter Crash game"></canvas>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),x=c.getContext("2d");
const W=c.width,H=c.height,G=.34,ground=505,anchor={x:155,y:375};
let score=0,shots=3,drag=false,won=false,ball,targets,blocks,particles=[],settle=0,message="",messageUntil=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resetBall(){ball={x:anchor.x,y:anchor.y,vx:0,vy:0,r:19,flying:false,used:false};settle=0}
function reset(){score=0;shots=3;won=false;particles=[];targets=[{x:690,y:463,r:18,alive:true},{x:748,y:463,r:18,alive:true},{x:720,y:367,r:18,alive:true}];blocks=[{x:650,y:405,w:18,h:100,vx:0,vy:0,a:0},{x:772,y:405,w:18,h:100,vx:0,vy:0,a:0},{x:711,y:390,w:145,h:18,vx:0,vy:0,a:0},{x:680,y:315,w:18,h:75,vx:0,vy:0,a:0},{x:750,y:315,w:18,h:75,vx:0,vy:0,a:0},{x:715,y:300,w:100,h:16,vx:0,vy:0,a:0}];resetBall();sync();show("Drag, aim, release!",1200)}
function sync(){}
function show(t,ms=1000){message=t;messageUntil=performance.now()+ms}
function view(){const r=c.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),dw=W*scale,dh=H*scale;return{r,scale,ox:(r.width-dw)/2,oy:(r.height-dh)/2}}
function pos(e){const v=view();return{x:(e.clientX-v.r.left-v.ox)/v.scale,y:(e.clientY-v.r.top-v.oy)/v.scale}}
c.addEventListener("pointerdown",e=>{const p=pos(e);if(p.x>780&&p.y>505&&p.y<560){reset();return}if(won||ball.flying||shots<=0)return;if(Math.hypot(p.x-ball.x,p.y-ball.y)<45){drag=true;c.setPointerCapture(e.pointerId)}});
c.addEventListener("pointermove",e=>{if(!drag)return;const p=pos(e),dx=p.x-anchor.x,dy=p.y-anchor.y,d=Math.hypot(dx,dy)||1,m=Math.min(115,d);ball.x=anchor.x+dx/d*m;ball.y=anchor.y+dy/d*m});
function launch(e){if(!drag)return;drag=false;const dx=anchor.x-ball.x,dy=anchor.y-ball.y;if(Math.hypot(dx,dy)<10){resetBall();return}ball.vx=dx*.135;ball.vy=dy*.135;ball.flying=true;ball.used=true;shots--;sync()}
c.addEventListener("pointerup",launch);c.addEventListener("pointercancel",launch);

function hitTarget(t){if(!t.alive)return;const d=Math.hypot(ball.x-t.x,ball.y-t.y);if(d<ball.r+t.r&&Math.hypot(ball.vx,ball.vy)>2.4){t.alive=false;score+=1000;sync();burst(t.x,t.y);show("+1000");if(targets.every(q=>!q.alive)){won=true;score+=shots*500;sync();show("LEVEL CLEARED!",3000)}}}
function burst(px,py){for(let i=0;i<12;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.7)*6,l:30})}
function update(){
 if(ball.flying){ball.vy+=G;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.997;ball.vy*=.997;
  if(ball.y+ball.r>ground){ball.y=ground-ball.r;ball.vy*=-.43;ball.vx*=.76;if(Math.abs(ball.vy)<.7)ball.vy=0}
  blocks.forEach(b=>{const l=b.x-b.w/2,r=b.x+b.w/2,t=b.y-b.h/2,bt=b.y+b.h/2;if(ball.x+ball.r>l&&ball.x-ball.r<r&&ball.y+ball.r>t&&ball.y-ball.r<bt){const speed=Math.hypot(ball.vx,ball.vy);b.vx+=ball.vx*.08;b.vy+=ball.vy*.03;ball.vx*=-.42;ball.vy*=-.35;if(speed>3){score+=50;sync()}}});
  targets.forEach(hitTarget);
  if(ball.x>W+80||ball.x<-80||ball.y>H+80||(ball.vx===0&&ball.vy===0)){settle++}else if(Math.hypot(ball.vx,ball.vy)<.55&&ball.y>450)settle++;else settle=0;
  if(settle>45&&!won){if(shots>0){resetBall();show("Next critter!")}else show("Out of critters — restart!",2500)}
 }
 blocks.forEach(b=>{if(Math.abs(b.vx)>.02||Math.abs(b.vy)>.02){b.vy+=G*.35;b.x+=b.vx;b.y+=b.vy;b.vx*=.94;b.vy*=.94;if(b.y+b.h/2>ground){b.y=ground-b.h/2;b.vy*=-.15;b.vx*=.8}targets.forEach(t=>{if(t.alive&&Math.abs(t.x-b.x)<b.w/2+t.r&&Math.abs(t.y-b.y)<b.h/2+t.r&&Math.hypot(b.vx,b.vy)>1.5){t.alive=false;score+=1000;sync();burst(t.x,t.y);if(targets.every(q=>!q.alive)){won=true;show("LEVEL CLEARED!",3000)}}})}});
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l--});particles=particles.filter(p=>p.l>0)
}
function cloud(cx,cy,s){x.fillStyle="#fff";x.beginPath();x.arc(cx,cy,24*s,0,7);x.arc(cx+25*s,cy-8*s,31*s,0,7);x.arc(cx+55*s,cy,23*s,0,7);x.fill()}
function roundRect(px,py,w,h,r,fill,stroke){
 x.beginPath();x.roundRect(px,py,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}
}
function draw(){
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#72c9ff");g.addColorStop(1,"#d9f2ff");x.fillStyle=g;x.fillRect(0,0,W,H);
 cloud(100,90,.8);cloud(420,120,.55);cloud(760,70,.7);
 x.fillStyle="#6fb84f";x.fillRect(0,ground,W,H-ground);x.fillStyle="#4b8d37";x.fillRect(0,ground,W,8);

 // compact in-canvas HUD
 x.textBaseline="middle";x.fillStyle="#101827dd";roundRect(14,14,872,58,18,"#101827dd");
 x.fillStyle="#fff";x.font="900 25px system-ui,-apple-system,sans-serif";x.textAlign="left";x.fillText("CRITTER CRASH",32,43);
 x.font="700 18px system-ui,-apple-system,sans-serif";x.textAlign="right";x.fillText("Score "+score+"   •   Critters "+shots,868,43);

 // slingshot
 x.strokeStyle="#75451f";x.lineWidth=16;x.lineCap="round";x.beginPath();x.moveTo(130,ground);x.lineTo(145,370);x.moveTo(180,ground);x.lineTo(165,370);x.stroke();
 if(drag){x.strokeStyle="#3a2518";x.lineWidth=7;x.beginPath();x.moveTo(145,370);x.lineTo(ball.x,ball.y);x.lineTo(165,370);x.stroke();
  const dx=anchor.x-ball.x,dy=anchor.y-ball.y;for(let i=1;i<9;i++){const tt=i*.12,px=anchor.x+dx*.135*tt*38,py=anchor.y+dy*.135*tt*38+.5*G*(tt*38)*(tt*38);x.fillStyle="#ffffffaa";x.beginPath();x.arc(px,py,4,0,7);x.fill()}}
 blocks.forEach(b=>{x.save();x.translate(b.x,b.y);x.rotate(b.a);x.fillStyle="#b97836";x.fillRect(-b.w/2,-b.h/2,b.w,b.h);x.strokeStyle="#77471f";x.lineWidth=3;x.strokeRect(-b.w/2,-b.h/2,b.w,b.h);x.restore()});
 targets.forEach(t=>{if(!t.alive)return;x.fillStyle="#754bd1";x.beginPath();x.arc(t.x,t.y,t.r,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(t.x-6,t.y-4,5,0,7);x.arc(t.x+6,t.y-4,5,0,7);x.fill();x.fillStyle="#222";x.beginPath();x.arc(t.x-5,t.y-3,2,0,7);x.arc(t.x+7,t.y-3,2,0,7);x.fill()});
 x.fillStyle="#f15b45";x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(ball.x-6,ball.y-5,5,0,7);x.arc(ball.x+6,ball.y-5,5,0,7);x.fill();x.fillStyle="#222";x.beginPath();x.arc(ball.x-5,ball.y-4,2,0,7);x.arc(ball.x+7,ball.y-4,2,0,7);x.fill();
 particles.forEach(p=>{x.globalAlpha=p.l/30;x.fillStyle="#8b5cf6";x.fillRect(p.x,p.y,6,6);x.globalAlpha=1});

 // in-canvas instruction/restart strip
 roundRect(14,516,872,34,12,"#101827cc");
 x.font="600 14px system-ui,-apple-system,sans-serif";x.textAlign="left";x.fillStyle="#dbe7f5";x.fillText("Drag critter • Aim • Release",28,533);
 x.textAlign="right";x.fillStyle="#f6b73c";x.font="800 14px system-ui,-apple-system,sans-serif";x.fillText("RESTART",870,533);

 if(message&&performance.now()<messageUntil){x.font="800 18px system-ui,-apple-system,sans-serif";x.textAlign="center";const mw=Math.max(180,x.measureText(message).width+34);roundRect((W-mw)/2,84,mw,38,19,"#101827e8","#ffffff44");x.fillStyle="#fff";x.fillText(message,W/2,103)}
}
function loop(){update();draw();requestAnimationFrame(loop)}reset();loop();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
})();
</script>
</body></html>
