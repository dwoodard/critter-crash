<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>Critter Crash</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;touch-action:none}body{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d');
let w=0,h=0,dpr=1,drag=false,flying=false,hit=false;
let anchor={x:0,y:0},ball={x:0,y:0,vx:0,vy:0,r:22},target={x:0,y:0,r:42};
const gravity=900,maxPull=120,launchScale=6.2;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);
 anchor={x:Math.max(85,w*.18),y:h*.68};target={x:w*.78,y:h*.58,r:Math.max(34,Math.min(48,w*.06))};
 if(!flying&&!drag){ball.x=anchor.x;ball.y=anchor.y}
}
function reset(){drag=false;flying=false;hit=false;ball.x=anchor.x;ball.y=anchor.y;ball.vx=ball.vy=0}
function p(e){return{x:e.clientX,y:e.clientY}}
function down(e){if(flying){reset();return}const q=p(e);if(Math.hypot(q.x-ball.x,q.y-ball.y)<=60){drag=true;c.setPointerCapture?.(e.pointerId);e.preventDefault()}}
function move(e){if(!drag)return;const q=p(e),dx=q.x-anchor.x,dy=q.y-anchor.y,d=Math.hypot(dx,dy)||1,m=Math.min(maxPull,d);ball.x=anchor.x+dx/d*m;ball.y=anchor.y+dy/d*m;e.preventDefault()}
function up(e){if(!drag)return;drag=false;const dx=anchor.x-ball.x,dy=anchor.y-ball.y;if(Math.hypot(dx,dy)<8){reset();return}ball.vx=dx*launchScale;ball.vy=dy*launchScale;flying=true;e.preventDefault()}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});
addEventListener('resize',resize);
let prev=performance.now();
function update(now){const dt=Math.min(.025,(now-prev)/1000);prev=now;if(flying&&!hit){ball.vy+=gravity*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(Math.hypot(ball.x-target.x,ball.y-target.y)<ball.r+target.r){hit=true;flying=false;try{navigator.vibrate?.(35)}catch(_){}}if(ball.x>w+80||ball.y>h+80||ball.x<-80){flying=false}}}
function circle(px,py,r,color){x.fillStyle=color;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill()}
function critter(){circle(ball.x,ball.y,ball.r,'#ef5b45');circle(ball.x-7,ball.y-6,5,'white');circle(ball.x+7,ball.y-6,5,'white');circle(ball.x-6,ball.y-5,2,'#17202b');circle(ball.x+8,ball.y-5,2,'#17202b')}
function draw(){
 x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#73caff');sky.addColorStop(1,'#daf3ff');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#69ad4c';x.fillRect(0,h*.82,w,h*.18);
 x.fillStyle='#101827dd';x.fillRect(0,0,w,54);x.fillStyle='white';x.font='900 18px system-ui';x.textBaseline='middle';x.fillText('CRITTER CRASH — CONTROL TEST',16,27);x.textAlign='right';x.font='700 11px ui-monospace,monospace';x.fillStyle='#9fb0c6';x.fillText('BUILD 10',w-14,27);x.textAlign='left';
 x.strokeStyle='#75451f';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(anchor.x-16,h*.82);x.lineTo(anchor.x-8,anchor.y-10);x.moveTo(anchor.x+16,h*.82);x.lineTo(anchor.x+8,anchor.y-10);x.stroke();
 if(drag){x.strokeStyle='#392317';x.lineWidth=5;x.beginPath();x.moveTo(anchor.x-8,anchor.y-10);x.lineTo(ball.x,ball.y);x.lineTo(anchor.x+8,anchor.y-10);x.stroke();
  const vx=(anchor.x-ball.x)*launchScale,vy=(anchor.y-ball.y)*launchScale;for(let i=1;i<=8;i++){const t=i*.12,px=ball.x+vx*t,py=ball.y+vy*t+.5*gravity*t*t;circle(px,py,3,'#ffffffbb')}}
 circle(target.x,target.y,target.r,hit?'#63c66d':'#754bd1');x.fillStyle='white';x.textAlign='center';x.font='900 15px system-ui';x.fillText(hit?'HIT!':'HIT ME',target.x,target.y+5);x.textAlign='left';
 critter();
 x.fillStyle='#101827';x.textAlign='center';x.font='700 14px system-ui';const text=hit?'GOOD — TAP THE SCREEN TO RESET':flying?'WATCH THE SHOT':'TOUCH THE RED CRITTER • PULL BACK • RELEASE';x.fillText(text,w/2,h-22);x.textAlign='left'
}
function loop(now){update(now);draw();requestAnimationFrame(loop)}resize();reset();requestAnimationFrame(loop);
if('serviceWorker'in navigator)addEventListener('load',async()=>{try{const r=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await r.update()}catch(_){}});
})();
</script></body></html>
